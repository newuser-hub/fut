name: FUT - Integrar Premier League 2026-27

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-premier-league.yml"
      - "scripts/ingest_premier_league.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fut-ingest-premier-league
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar formato da checklist oficial
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://cdn.shopify.com/s/files/1/0739/2015/1805/files/26_27_Topps_Flagship_Premier_League_Checklist_2.pdf?v=1784890627' -o /tmp/premier.pdf
          python3 -m pip install --quiet pymupdf
          python3 - <<'PY'
          import fitz
          import re
          doc=fitz.open('/tmp/premier.pdf')
          s=[]
          for idx,page in enumerate(doc):
            s.extend([f'===== PAGE {idx} =====']+page.get_text(sort=True).splitlines())
          print('TOTAL LINES',len(s))
          for i,x in enumerate(s[1140:1180],1140):print(i,repr(x))
          print('==== HEADERS ====')
          for i,x in enumerate(s):
            if re.match(r'^[ \t]*[A-Z][A-Z0-9 /&-]{5,}[ \t]*$',x):
              print(i,repr(x))
          PY
