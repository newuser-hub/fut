name: FUT - Diagnostico Serie A e Ligue 1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-italia-franca.yml"
      - "scripts/ingest_italia_franca.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fut-audit-italia-franca
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar identificadores e URLs de imagens
        shell: bash
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from collections import Counter
          from urllib.parse import urljoin,urlparse
          from urllib.request import urlopen,Request
          urls={
           'ITA': 'https://stickersone.com/it/albumgrid-calciatori-2026-2027-panini-4689',
           'FRA': 'https://stickersone.com/en/albumgrid-ligue-1-2026-2027-adrenalyn-xl-panini-4650',
           'UNA': 'https://unacollezione.it/checklist/panini-calciatori-anno-2026-27-checklist',
          }
          for key,url in urls.items():
            print('===',key,flush=True)
            html=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read(3_000_000).decode('utf-8','replace')
            bs=BeautifulSoup(html,'html.parser')
            imgs=bs.find_all('img')
            print('IMG COUNT',len(imgs))
            print('DOMAINS',Counter(urlparse(urljoin(url,i.get('src',''))).netloc for i in imgs).most_common(10))
            print('PATH_PREFIX',Counter('/'.join((i.get('src') or '').split('/')[:5]) for i in imgs).most_common(12))
            print('TAIL',[(i.get('src'),i.get('alt')) for i in imgs[-16:]])
            for token in ['1', '5','10','441','589','825','Figurina n°','Card n°']:
              texts=bs.find_all(string=lambda x:x and token in x)
              if texts:
                node=texts[0].parent
                for _ in range(2):node=node.parent
                print('SAMPLE',repr(token),str(node)[:850].replace('\n',' '))
          PY
