  <title>FUT — Arquivo de Cadernetas Digitais</title>
  <style>
    :root{--night:#07192e;--navy:#102948;--sky:#26d2ba;--gold:#dfb56b;--cream:#f6f3e9;--paper:#fffcf5;--line:#dcd7cb;--ink:#16283c;--muted:#657284;--shadow:0 18px 55px rgba(5,20,37,.24);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    .app-top{position:sticky;top:0;z-index:80;background:rgba(7,25,46,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.1)}

    .brand{border:0;background:none;color:#fff;text-align:left;display:flex;align-items:center;gap:11px;padding:2px 0}.brand-mark{display:grid;place-items:center;width:41px;height:41px;border:1px solid var(--gold);border-radius:13px;color:var(--gold);font-weight:900;font-size:22px}.brand strong{font-size:16px;letter-spacing:.08em}.brand small{display:block;color:#b1bec9;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
    .top-actions,.nav-actions,.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.21);border-radius:99px;background:rgba(255,255,255,.06);color:#fff;padding:10px 15px;font-weight:650;font-size:12px;white-space:nowrap}.pill:hover,.pill:focus-visible{border-color:var(--sky);outline:none}.pill.is-active{background:var(--sky);color:#05313c;border-color:var(--sky)}.pill.gold{background:var(--gold);color:#16253d;border-color:var(--gold)}
    .progress-strip{height:3px;background:#19334e}.progress-strip >div{height:100%;background:linear-gradient(90deg,var(--gold),var(--sky));transition:width .3s}
    .content{max-width:1450px;margin:auto;padding:34px 24px 70px}.section-label{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}.section-label:before{content:"";width:20px;height:1px;background:var(--gold)}h1,h2,h3,p{margin-top:0}

    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 34px}.metric{padding:22px 20px;border:1px solid #29415b;border-radius:15px;background:#112942}.metric strong{font-size:28px;letter-spacing:-.04em;display:block}.metric span{color:#aebecb;text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:800}

    .search-wrap{display:flex;gap:9px;align-items:center;background:#112942;border:1px solid #314d68;border-radius:12px;padding:0 14px;width:min(100%,360px);color:#9bb2c5}.search-wrap input{background:transparent;outline:none;border:0;color:#fff;padding:13px 2px;width:100%;font-size:14px}.search-wrap input::placeholder{color:#9bb2c5}
    .index-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.index-card{border:1px solid #29445f;border-radius:14px;background:#102b47;text-align:left;color:#fff;min-height:145px;padding:21px;transition:background .2s,border-color .2s,transform .2s;display:flex;flex-direction:column;justify-content:space-between}.index-card:hover{background:#163955;border-color:var(--gold);transform:translateY(-2px)}.index-card small{color:var(--gold);font-size:10px;font-weight:850;letter-spacing:.12em}.index-card h3{font-size:19px;margin:11px 0 2px}.index-card .count{color:#b7c7d5;font-size:12px}.bar{height:4px;background:#30465c;border-radius:5px;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;border-radius:4px;background:var(--sky)}
    .paper-shell{touch-action:pan-y;border-radius:17px;padding:28px;background:linear-gradient(90deg,#e8e1d4 0,#fffaf1 3%,#fffaf1 97%,#e6d8c4 100%);color:var(--ink);box-shadow:var(--shadow);min-height:450px;position:relative}.paper-shell:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:rgba(113,75,37,.13)}.paper-top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:25px}.paper-top small{font-size:11px;letter-spacing:.15em;color:#92754a;font-weight:850;text-transform:uppercase}.paper-top h2{margin:6px 0 0;font-size:27px;letter-spacing:-.03em}.paper-top .folio{font-size:12px;color:#667184;text-align:right}
    .toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 18px;align-items:center}.toolbar .tools{flex-wrap:wrap}.tool{border:1px solid #38516a;border-radius:9px;background:#132e4b;padding:11px 13px;color:#fff;font-size:12px;font-weight:750}.tool:hover{border-color:var(--sky)}.tool.accent{background:#117d78;border-color:#17887f}.tool.on{background:#dfb56b;border-color:#dfb56b;color:#16283c}.small-muted{color:#a9bbc9;font-size:12px}
    .card-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;perspective:1000px}.card-cell{min-width:0}.flip-card{position:relative;width:100%;border:0;padding:0;background:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;aspect-ratio: .72;perspective:950px;border-radius:9px;display:block}.flip-inner{display:block;width:100%;height:100%;position:relative;-webkit-transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.82,.2,1);transform-style:preserve-3d}.flip-card.is-flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:8px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}.cover-face{border:1px solid #1f3b59;background:radial-gradient(circle at 50% 25%,#3a5475 0,#1b3552 35%,#112940 72%);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 5px rgba(223,181,107,.12),0 4px 9px rgba(34,32,29,.13)}.cover-face:before,.cover-face:after{content:"";position:absolute;border:1px solid rgba(223,181,107,.48);border-radius:4px;inset:11px}.cover-face:after{inset:16px;opacity:.32}.cover-top{position:absolute;top:24px;font-size:10px;letter-spacing:.24em;color:#d8bd86;font-weight:900}.cover-number{font-size:clamp(26px,3.5vw,45px);font-weight:900;letter-spacing:-.08em;color:var(--gold)}.cover-bottom{position:absolute;bottom:23px;text-transform:uppercase;letter-spacing:.13em;font-size:9px;opacity:.75}.image-face{transform:rotateY(180deg);background:#dae2e5;border:1px solid #ccd4dc;display:flex;align-items:center;justify-content:center}.image-face img{display:block;width:77%;height:73%;max-width:100%;object-fit:contain;background:#fff;padding:3px;border:1px solid #c0cbd4;border-radius:4px;box-shadow:0 4px 12px rgba(21,40,60,.20)}.image-face:before{content:'MINIATURA';position:absolute;left:0;right:0;top:5px;color:#586b7e;font-size:clamp(6px,.7vw,9px);font-weight:900;letter-spacing:.14em;text-align:center;pointer-events:none}.flip-card.is-flipped .image-face{background:linear-gradient(145deg,#e9edf0,#d4dfe7)}.no-image{display:grid;place-items:center;text-align:center;padding:12px;height:100%;font-size:12px;line-height:1.5;color:#6a7686}.card-cell .card-bottom{display:flex;align-items:flex-start;justify-content:space-between;margin-top:9px;gap:4px;min-height:27px}.card-bottom .card-name{font-weight:800;font-size:11px;line-height:1.35;max-width:calc(100% - 28px)}.card-bottom .card-name.muted{color:#87909c}.star{border:0;background:transparent;color:#a2aeb9;font-size:19px;padding:0 2px}.star.saved{color:#ae7f2f}
    .page-nav{display:flex;align-items:center;justify-content:center;gap:13px;margin:24px 0}.page-nav .tool{font-size:13px}.page-indicator{font-size:13px;color:#b6c5cf;min-width:80px;text-align:center}.select-page{border:1px solid #36536d;border-radius:10px;background:#183450;color:#fff;padding:11px;max-width:235px;min-width:130px;font-size:12px}
    .result-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}.result{border:1px solid #31506b;border-radius:10px;padding:14px;text-align:left;color:#fff;background:#122c48;display:flex;justify-content:space-between;align-items:center;gap:10px}.result small{color:#b7c9d7}.result strong{display:block;margin-bottom:4px}.empty{border:1px dashed #45607a;border-radius:14px;padding:40px;text-align:center;color:#a9bfce}
    .footer{text-align:center;padding:32px 12px;color:#8095aa;font-size:12px;line-height:1.7}.footer a{color:#d1c4a0}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:#f6f3e9;color:#1b344c;border-radius:13px;box-shadow:var(--shadow);padding:13px 18px;font-weight:750;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,14,28,.87);z-index:200;display:grid;place-items:center;padding:20px}.modal{background:#fffdf7;max-width:min(100%,430px);width:100%;color:var(--ink);padding:24px;border-radius:16px;max-height:94dvh;overflow:auto}.modal-header{display:flex;justify-content:space-between;align-items:start;gap:20px}.modal-header h3{margin:0 0 6px}.modal p{font-size:13px;line-height:1.6;color:#516374}.modal img{max-width:100%;max-height:60dvh;display:block;margin:18px auto;border-radius:6px}.modal button{padding:9px 12px;border-radius:9px;border:1px solid #aaa;cursor:pointer;background:#fff}.modal .modal-controls{display:flex;justify-content:space-between;gap:8px}.hidden{display:none!important}

    @media(max-width:700px){.top-inner{padding:10px 14px}.brand strong{font-size:14px}.brand small{font-size:8px}.top-actions{width:100%;justify-content:space-between}.pill{padding:9px 12px}.content{padding:18px 12px 48px}.hero{grid-template-columns:1fr;padding:27px 24px;min-height:0}.hero-art{display:none}.hero h1{font-size:44px}.metric-row{grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 25px}.metric{padding:16px}.metric strong{font-size:24px}.index-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.index-card{padding:15px;min-height:125px}.index-card h3{font-size:15px}.section-heading{align-items:start;flex-direction:column}.search-wrap{width:100%}.paper-shell{padding:20px 14px}.paper-top h2{font-size:22px}.card-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cover-top{top:16px;font-size:7px}.cover-bottom{font-size:7px;bottom:16px}.cover-face:before{inset:7px}.cover-face:after{inset:11px}.cover-number{font-size:26px}.card-bottom .card-name{font-size:10px}.toolbar .tool{padding:10px 11px}.result-list{grid-template-columns:1fr}}
    @media(max-width:390px){.card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.paper-top .folio{font-size:10px}.top-actions .pill{font-size:11px;padding:9px 10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    /* Página principal do portal — mantém a linguagem visual da caderneta. */
    .portal-hero{position:relative;overflow:hidden;border:1px solid #315575;border-radius:24px;padding:clamp(27px,5vw,64px);background:radial-gradient(ellipse at 85% 15%,rgba(38,210,186,.14),transparent 42%),linear-gradient(125deg,#122e4c,#07192e 72%);margin-bottom:24px}
    .portal-hero:after{content:"FUT";position:absolute;right:-5%;bottom:-30%;font-weight:950;font-size:clamp(150px,25vw,350px);letter-spacing:-.13em;line-height:1;color:rgba(255,255,255,.035);pointer-events:none}
    .portal-hero h1{font-size:clamp(43px,7vw,86px);line-height:.99;letter-spacing:-.065em;margin:20px 0 23px;max-width:900px}.portal-hero h1 em{font-style:normal;color:var(--gold)}
    .portal-hero p{font-size:15px;line-height:1.8;color:#b9cbd9;max-width:660px}.portal-intro{position:relative;z-index:1}
    .library-summary{display:flex;gap:25px;flex-wrap:wrap;margin-top:32px}.library-summary span{font-size:12px;color:#bdcbd7}.library-summary strong{display:block;font-size:25px;color:white;letter-spacing:-.05em}
    .library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-top:20px}
    .library-tile{position:relative;overflow:hidden;min-width:0;min-height:386px;background:#102843;border:1px solid #2c4865;border-radius:19px;display:flex;flex-direction:column;color:#fff;text-align:left;padding:0;box-shadow:0 10px 34px rgba(0,0,0,.13);transition:border .2s,transform .2s,box-shadow .2s}
    .library-tile:not(.soon):hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.24)}
    .library-tile:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
    .library-cover{height:225px;background:radial-gradient(circle at center,#385475,#152c46);display:grid;place-items:center;position:relative;overflow:hidden}
    .library-cover img{display:block;max-width:68%;max-height:95%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 19px rgba(0,0,0,.55))}
    .library-cover::before{content:"";position:absolute;inset:15px;border:1px solid rgba(223,181,107,.13);border-radius:12px;pointer-events:none}
    .library-cover .cover-placeholder{font-weight:900;color:rgba(223,181,107,.82);font-size:72px;letter-spacing:-.08em}
    .library-tile.soon{opacity:.75}.library-tile.soon .library-cover{background:repeating-linear-gradient(135deg,#14314e,#14314e 14px,#172d45 14px,#172d45 28px)}
    .library-info{padding:20px 22px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
    .library-info .eyebrow{color:var(--gold);font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
    .library-info h3{font-size:20px;letter-spacing:-.035em;line-height:1.2;margin:0}
    .library-info p{font-size:12px;line-height:1.55;color:#afc1cf;margin:0}
    .library-tile-foot{padding-top:13px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#9fb8c8;font-size:12px;border-top:1px solid rgba(255,255,255,.09)}
    .library-tile-foot strong{color:var(--sky);font-size:12px}
    .portal-note{color:#9ab0c2;font-size:12px;line-height:1.7;margin:22px 2px}
    .subtrail{display:flex;align-items:center;gap:8px;color:#a4b9c8;font-size:12px;flex-wrap:wrap;margin-bottom:16px}
    .subtrail button{background:transparent;color:var(--gold);padding:4px 0;border:0;text-decoration:underline;text-underline-offset:3px}
    @media(max-width:1100px){.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.library-grid{grid-template-columns:1fr;gap:13px}.library-tile{min-height:310px}.library-cover{height:180px}.portal-hero{padding:30px 24px}.portal-hero h1{font-size:44px}.library-summary{gap:20px}.library-cover img{max-width:53%}.library-info h3{font-size:19px}}

    /* Biblioteca de entrada: navegação progressiva por categorias e anos. */
    .collection-browser{scroll-margin-top:110px;margin-bottom:26px}
    .collection-toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
    .collection-toolbar .section-heading{margin-bottom:15px}
    .portal-search{display:flex;align-items:center;gap:10px;background:#112942;border:1px solid #34526a;border-radius:12px;padding:0 14px;width:min(100%,370px);color:#aec9da;margin-bottom:15px}
    .portal-search:focus-within{border-color:var(--sky)}
    .portal-search input{background:transparent;border:0;outline:0;padding:13px 0;width:100%;font-size:13px;color:#fff}
    .portal-search input::placeholder{color:#a7bacb}
    .category-shortcuts{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 18px}
    .category-shortcut{border:1px solid #3b536c;background:#122c48;border-radius:12px;padding:11px 16px;color:#fff;font-weight:750;font-size:13px}
    .category-shortcut:hover,.category-shortcut:focus-visible{border-color:var(--sky);outline:none}
    .category-shortcut small{font-size:11px;margin-left:8px;color:#a9c8d6}
    .collection-group{background:#102841;border:1px solid #334f6a;border-radius:19px;overflow:hidden;margin:13px 0}
    .collection-group[open]{border-color:#496781}
    .collection-group>summary{list-style:none;display:flex;gap:14px;align-items:center;padding:21px 23px;cursor:pointer}
    .collection-group>summary::-webkit-details-marker{display:none}
    .collection-group>summary:hover{background:#15334e}
    .collection-group>summary:focus-visible{outline:2px solid var(--sky);outline-offset:-3px}
    .collection-group-mark{display:grid;place-items:center;background:#1b3d58;border:1px solid rgba(223,181,107,.36);border-radius:12px;color:var(--gold);font-size:12px;font-weight:900;width:43px;height:43px;flex:none}
    .collection-group-title{display:flex;flex-direction:column;gap:5px;flex:1}
    .collection-group-title strong{font-size:20px;letter-spacing:-.035em}
    .collection-group-title small{font-size:12px;color:#abc2d1;line-height:1.5}
    .collection-chevron{font-size:22px;color:var(--gold);transition:transform .2s}
    .collection-group[open] .collection-chevron{transform:rotate(180deg)}
    .collection-group-body{border-top:1px solid rgba(255,255,255,.08);padding:5px 22px 25px}
    .collection-year{margin-top:22px}
    .collection-year+.collection-year{margin-top:32px}
    .collection-year-head{display:flex;gap:13px;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
    .collection-year-head h4{color:var(--gold);font-size:20px;margin:0}
    .collection-year-head span{color:#adc3d0;font-size:12px}
    .collection-year .library-grid{margin-top:16px}
    .collection-empty{padding:28px;border:1px dashed #49657b;border-radius:12px;color:#b9ceda;font-size:13px}
    @media(max-width:700px){.collection-toolbar{display:block}.portal-search{width:100%}.category-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.category-shortcut{padding:11px 7px;font-size:12px}.category-shortcut small{margin-left:4px}.collection-group>summary{padding:15px 13px;gap:10px}.collection-group-mark{height:37px;width:37px}.collection-group-title strong{font-size:18px}.collection-group-title small{font-size:11px}.collection-group-body{padding:0 13px 17px}}
    @media(prefers-reduced-motion:reduce){.collection-chevron{transition:none}}
    .next-batch{border:1px solid rgba(223,181,107,.4);border-radius:17px;background:linear-gradient(120deg,#132e4a,#0b213a);padding:24px;margin:28px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
    .next-batch h3{font-size:20px;margin:7px 0}.next-batch p{font-size:12px;color:#a8bfd1;margin:0;line-height:1.65;max-width:630px}
    .next-batch .pill{flex-shrink:0}
    .roadmap-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .roadmap-summary{font-size:12px;color:#b9d2dc;margin-top:10px}
    .roadmap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}
    .roadmap-card{background:#102a45;border:1px solid #304d69;border-radius:15px;padding:16px;display:flex;flex-direction:column;gap:11px}
    .roadmap-card header{display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:12px;color:#aabfce}
    .roadmap-card header strong{color:var(--gold);letter-spacing:.05em}
    .roadmap-card ul{padding-left:17px;margin:0;display:grid;gap:7px;color:#dbe5ec;font-size:12px;line-height:1.4}
    .roadmap-card ul small{color:#9fb6c7;margin-left:4px}
    .roadmap-card .pill{align-self:flex-start;font-size:11px}
    .roadmap-note{color:#aabeca;font-size:12px;line-height:1.6;margin:16px 3px 4px}
    @media(max-width:700px){.roadmap-grid{grid-template-columns:1fr}.roadmap-card{padding:14px}}
    /* Auditoria 8: alvos táteis e foco visível sem alterar a linguagem visual. */
    .star{min-width:44px;min-height:44px;display:grid;place-items:center;color:#536273;border-radius:9px}
    .star.saved{color:#795212}
    .card-bottom .card-name{max-width:calc(100% - 48px)}
    .tool,.pill,.category-shortcut,.modal button,.subtrail button{min-height:44px}
    .category-shortcut:focus-visible,.flip-card:focus-visible,.star:focus-visible,.tool:focus-visible,.pill:focus-visible,.modal button:focus-visible,.subtrail button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
    .modal button:focus-visible{outline-color:#0b617c}
      </style>
</head>
<body>
  <header class="app-top">
    <div class="top-inner">
      <button class="brand" data-action="portal" aria-label="Voltar às coleções"><span class="brand-mark">F</span><span><strong>FUT · CROMOS</strong><small>Arquivo de cadernetas digitais</small></span></button>
      <nav class="top-actions" aria-label="Navegação principal"><button class="pill" data-action="portal" id="nav-portal">⌂ Coleções</button><button class="pill" data-action="index" id="nav-index">▦ Índice</button><button class="pill" data-action="album" id="nav-album">▣ Caderneta</button><button class="pill" data-action="favorites" id="nav-favorites">☆ Favoritos</button><button class="pill" data-action="random" id="nav-random" title="Revelar um cromo aleatório">✦ Surpresa</button></nav>
    </div><div class="progress-strip" aria-hidden="true"><div id="top-progress" style="width:0%"></div></div>
  </header>
  <main class="content" id="app"><div class="empty">A carregar o catálogo…</div></main>
  <footer class="footer"><div>FUT — arquivo independente para consulta pessoal · Não afiliado à Panini, FIFA, UEFA ou Cromos.pt</div><div>Imagens e marcas pertencem aos respetivos titulares. Dados e imagens referenciados a partir de <a href="https://www.cromos.pt/" target="_blank" rel="noopener noreferrer">Cromos.pt</a>. A disponibilidade pública não equivale a uma licença de reprodução.</div></footer>
  <input type="file" id="import-file" accept="application/json,.json" class="hidden" aria-label="Importar progresso">
  <div class="toast" id="toast" role="status" aria-live="polite"></div><div id="modal-root"></div>
  <script>
  (() => {
    "use strict";
    let LIBRARY = [];
    let EXPANSION_PLAN = [];
    let portalSearch = '';
    let activeCollectionId = null;
    const stateKey = id => "fut.album."+id+".progress.v1";
    const app = document.getElementById("app");
    const toastNode = document.getElementById("toast");
    let catalog = {cards:[], sections:[]}; let sections = []; let pages = []; let currentPage = 0; let view = "portal"; let query = ""; let modalCard = null;
    let state = {revealed:{}, favorites:{}};
    let modalReturnFocus = null;
    let modalPreviousOverflow = '';
    const scrollBehavior = () => window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches ? 'auto' : 'smooth';
    let selectionEpoch = 0; // Invalida pedidos pendentes ao selecionar ou navegar.
    // Estado independente por coleção: é carregado ao selecionar a caderneta.
    const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    const percent = (n,d) => d?Math.round(n*100/d):0;
    const keyCard = c => c.id;
    const isRevealed = c => !!state.revealed[keyCard(c)];
    const isFavorite = c => !!state.favorites[keyCard(c)];
    // Mantemos a chave histórica e os mapas {id:true}; não migramos nem reescrevemos
    // automaticamente o progresso existente no navegador.
    function progressFlags(raw, validIds){
      const result=Object.create(null);
      if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
      for(const [id,value] of Object.entries(raw)){
        if(validIds.has(id)&&value)result[id]=true;
      }
      return result;
    }
    function emptyProgress(){return {revealed:Object.create(null),favorites:Object.create(null)}}
    function readProgress(id,cards){
      const validIds=new Set(cards.map(c=>c.id));
      try{
        const saved=JSON.parse(localStorage.getItem(stateKey(id))||'{}');
        if(!saved||typeof saved!=='object'||Array.isArray(saved))return emptyProgress();
        return {revealed:progressFlags(saved.revealed,validIds),
          favorites:progressFlags(saved.favorites,validIds)};
      }catch(e){return emptyProgress()}
    }
    function save(nextState=state){
      if(!activeCollectionId){notify('Não existe uma coleção aberta para guardar.');return false}
      try{
        localStorage.setItem(stateKey(activeCollectionId),JSON.stringify(nextState));
        return true;
      }catch(e){
        notify('Não foi possível guardar o progresso neste dispositivo. Verifica o espaço e as permissões.');
        return false;
      }
    }

    function notify(message){toastNode.textContent=message;toastNode.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastNode.classList.remove("show"),2600)}
    function pageFor(cardId){return pages.findIndex(p=>p.cards.some(c=>c.id===cardId))}
    function sectionStats(section){let n=section.cards.filter(isRevealed).length;return {n,total:section.cards.length,pct:percent(n,section.cards.length)}}
    function stats(){return {all:catalog.cards.length, revealed:catalog.cards.filter(isRevealed).length,favs:catalog.cards.filter(isFavorite).length}}
    function computePages(){sections=[];pages=[];const map=new Map();catalog.cards.forEach(c=>{const slug=c.sectionSlug||"outros";if(!map.has(slug)){const s={slug,name:c.section||slug,cards:[]};map.set(slug,s);sections.push(s)}map.get(slug).cards.push(c)});sections.forEach(s=>{for(let offset=0;offset<s.cards.length;offset+=9)pages.push({section:s,cards:s.cards.slice(offset,offset+9),pageInSection:1+Math.floor(offset/9),sectionPages:Math.ceil(s.cards.length/9)})})}
    const sectionLabel = c => c.section||"Coleção";
    const buttons = [{action:"portal"},{action:"index"},{action:"album"},{action:"favorites"}];
    function updateTop(){const s=stats();document.getElementById("top-progress").style.width=percent(s.revealed,s.all)+"%";buttons.forEach(b=>document.getElementById("nav-"+b.action).classList.toggle("is-active",view===b.action));["index","album","favorites","random"].forEach(a=>document.getElementById("nav-"+a).disabled=!activeCollectionId)}
    function portalStats(item){
      try{
        const raw=JSON.parse(localStorage.getItem(stateKey(item.id))||'{}');
        const count=Object.keys(raw.revealed||{}).length;
        return {revealed:Math.min(count,item.count||0),pct:percent(count,item.count||0)};
      }catch(e){return {revealed:0,pct:0}}
    }
    function roadmapPending(){
      const active=new Set(LIBRARY.filter(x=>x.status==='active').map(x=>x.id));
      return EXPANSION_PLAN.filter(x=>!active.has(x.id)&&x.imageAudit!=='blocked');
    }
    function roadmapPanel(){
      if(!EXPANSION_PLAN.length){
        const waiting=LIBRARY.filter(x=>x.status!=='active').slice(0,2);
        return '<section class="next-batch"><div><span class="section-label">Expansão contínua</span><h3>Próximo lote de duas coleções</h3><p>'+esc(waiting.map(x=>x.title).join(' + ')||'Novas coleções a selecionar')+'</p></div><button class="pill gold" data-action="next-batch">Copiar autorização ↗</button></section>';
      }
      const pending=roadmapPending();
      const active=new Set(LIBRARY.filter(x=>x.status==='active').map(x=>x.id));
      const completed=EXPANSION_PLAN.filter(x=>active.has(x.id)).length;
      const blocked=EXPANSION_PLAN.filter(x=>!active.has(x.id)&&x.imageAudit==='blocked').length;
      const next=pending.slice(0,2);
      let html='<section class="next-batch" aria-label="Plano de expansão FUT"><div><span class="section-label">Roteiro de expansão</span><h3>'+EXPANSION_PLAN.length+' coleções · '+(EXPANSION_PLAN.length/2)+' lotes de duas</h3><p>Próximo lote: '+(next.length?next.map(x=>esc(x.title)).join(' + '):'Plano concluído')+'. Cada coleção é auditada antes da integração; as imagens e os extras podem não estar disponíveis.</p><div class="roadmap-summary">'+completed+' de '+EXPANSION_PLAN.length+' integradas no FUT · '+blocked+' em espera por imagens · '+pending.length+' elegíveis por auditar</div></div><div class="roadmap-tools"><button class="pill gold" data-action="next-batch"'+(next.length?'':' disabled')+'>✦ Copiar próximo pedido</button><button class="pill" data-action="roadmap-toggle" aria-controls="roadmap-grid" aria-expanded="false">Ver '+(EXPANSION_PLAN.length/2)+' lotes</button></div></section>';
      html+='<div id="roadmap-grid" class="roadmap-grid hidden" aria-label="Todos os lotes previstos">';
      for(let i=0;i<EXPANSION_PLAN.length;i+=2){
        const pair=EXPANSION_PLAN.slice(i,i+2);
        const n=pair.filter(x=>active.has(x.id)).length;
        const deferred=pair.filter(x=>!active.has(x.id)&&x.imageAudit==='blocked').length;
        const eligible=pair.length-n-deferred;
        const label=n===2?'Concluído':deferred?(n+' integrada(s) · '+deferred+' aguarda(m) imagens'):(n===1?'1 de 2 concluída':'Por auditar');
        html+='<article class="roadmap-card"><header><strong>LOTE '+String(i/2+1).padStart(2,'0')+'</strong><span>'+label+'</span></header><ul>'+
          pair.map(x=>'<li>'+esc(x.title)+' <small>('+x.declaredMainCount+' principais)</small>'+(active.has(x.id)?' ✓':x.imageAudit==='blocked'?' · sem imagens':'')+'</li>').join('')+'</ul>'+
          '<button class="pill'+(eligible===0?'':' gold')+'" data-action="roadmap-copy" data-batch="'+Math.floor(i/2)+'"'+(eligible===0?' disabled':'')+'>'+(eligible===0?(n===2?'Concluído':'Aguardar fotografias'):'Copiar autorização deste lote')+'</button></article>';
      }
      html+='</div><p class="roadmap-note">Os botões copiam um pedido para submeter no ChatGPT. Não alteram o GitHub diretamente. Antes de cada lote, serão verificados a branch main, as execuções em curso, os cromos e as fotografias disponíveis.</p>';
      return html;
    }
    function copyRoadmapAuthorization(batchIndex){
      const pending=roadmapPending();
      const pair=batchIndex==null?pending.slice(0,2):EXPANSION_PLAN.slice(batchIndex*2,batchIndex*2+2).filter(x=>pending.some(p=>p.id===x.id));
      const selected=[...pair];
      if(batchIndex!=null && selected.length===1){
        const extra=pending.find(x=>!selected.some(y=>y.id===x.id));
        if(extra)selected.push(extra);
      }
      if(!selected.length){notify('Não existem coleções pendentes neste lote.');return}
      const scope=selected.map(x=>x.title+' (Cromos.pt ID '+x.sourceId+')').join(' e ');
      const text='Autorizo o próximo lote de expansão FUT no repositório newuser-hub/fut: integra '+scope+'. Segue o plano public/expansion-plan.json da branch main, sem duplicar coleções já ativas e sem ultrapassar o âmbito deste lote. Verifica primeiro os commits e GitHub Actions em curso, preserva todas as coleções e progressos locais. Audita posições, nomes, secções, duplicados, imagens reais por HTTP/MIME/tamanho/SHA-256 e alternativas caso falte cobertura. Não inventes imagens; documenta falhas e substituições. Valida o motor, mantém a proteção por palavra-passe, publica no Vercel, confirma READY e apresenta o balanço e os botões para os lotes seguintes.';
      if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>notify('Autorização copiada. Cola-a na conversa do ChatGPT.')).catch(()=>window.prompt('Copia o pedido para o ChatGPT:',text));
      else window.prompt('Copia o pedido para o ChatGPT:',text);
    }
    // Metadados classificados sem alterar catálogos, URLs ou progresso.
    const PORTAL_CATEGORIES=[
      {id:'portugal',title:'Portugal',mark:'PT',description:'Liga Portugal e coleções de futebol português'},
      {id:'selecoes',title:'Seleções',mark:'SE',description:'Campeonatos do Mundo, Europeus e outras seleções'},
      {id:'champions',title:'Champions League',mark:'CL',description:'Cadernetas UEFA Champions League e Match Attax'},
      {id:'outros',title:'Outros',mark:'OT',description:'Ligas estrangeiras e outras competições de clubes'}
    ];
    const ptCollator=new Intl.Collator('pt-PT',{numeric:true,sensitivity:'base'});
    const normalText=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-PT');
    function collectionGroup(item){
      const category=normalText(item.category);
      return category.includes('selecoes')?'selecoes':category.includes('portugal')?'portugal':category.includes('champions league')?'champions':'outros';
    }
    function collectionYear(item){
      const year=String(item.year||'').trim();
      if(/^(?:19|20)\d{2}$/.test(year))return Number(year);
      const match=/^(\d{2})\s*\/\s*\d{2}$/.exec(year);
      if(match)return Number(match[1])>=90?1900+Number(match[1]):2000+Number(match[1]);
      const found=/(?:19|20)\d{2}/.exec(year);
      return found?Number(found[0]):0;
    }
    function collectionTile(item){
      const enabled=item.status==='active',progress=enabled?portalStats(item):{revealed:0,pct:0};
      const top='<div class="library-cover">'+(item.cover?'<img src="'+esc(item.cover)+'" loading="lazy" alt="Capa da coleção '+esc(item.title)+'" onerror="this.style.display=\'none\'">':'<span class="cover-placeholder" aria-hidden="true">'+esc(item.year)+'</span>')+'</div>';
      const info='<div class="library-info"><span class="eyebrow">'+esc(item.category)+' · '+esc(item.year)+'</span><h3>'+esc(item.title)+'</h3><p>'+esc(item.description)+'</p><div class="library-tile-foot"><span>'+(item.count?item.count+' cromos':'Catálogo por preparar')+'</span><strong>'+(enabled?'Abrir coleção ↗':'Em preparação')+'</strong></div>'+(enabled?'<div class="bar"><i style="width:'+progress.pct+'%"></i></div><span style="color:#a7c7d1;font-size:11px">'+progress.revealed+' / '+item.count+' revelados</span>':'')+'</div>';
      return (enabled?'<button class="library-tile" data-action="collection" data-collection="'+esc(item.id)+'" aria-label="Abrir '+esc(item.title)+'">':'<article class="library-tile soon">')+top+info+(enabled?'</button>':'</article>');
    }
    function portalView(){
      const ready=LIBRARY.filter(c=>c.status==='active');
      let html='<section class="portal-hero"><div class="portal-intro"><span class="section-label">Arquivo interativo · Futebol</span><h1>As grandes coleções.<br><em>Uma só caderneta digital.</em></h1><p>Descobre os cromos, vira cada um, amplia a imagem e guarda o teu progresso. Cada coleção tem o seu próprio índice, favoritos e registo neste equipamento.</p><div class="hero-actions"><button class="pill gold" data-action="scroll-collections">Explorar coleções ↓</button>'+(activeCollectionId?'<button class="pill" data-action="index">Continuar a última coleção ↗</button>':'')+'</div><div class="library-summary"><span><strong>'+LIBRARY.length+'</strong>Coleções no portal</span><span><strong>'+ready.length+'</strong>Disponíveis</span><span><strong>'+ready.reduce((n,x)=>n+x.count,0).toLocaleString('pt-PT')+'</strong>Cromos catalogados</span></div></div></section>';
      html+='<section class="collection-browser" id="collection-grid"><div class="collection-toolbar"><div class="section-heading"><div><span class="section-label">A tua biblioteca</span><h2>Explorar por categoria e ano</h2><p>Escolhe uma categoria. As coleções surgem do ano mais recente para o mais antigo.</p></div></div><label class="portal-search">⌕ <input id="portal-search" type="search" aria-label="Pesquisar coleções" placeholder="Pesquisar coleção, competição ou ano..." autocomplete="off" value="'+esc(portalSearch)+'"></label></div>';
      html+='<nav class="category-shortcuts" aria-label="Ir para categoria">'+PORTAL_CATEGORIES.map(cat=>'<button class="category-shortcut" data-action="jump-category" data-category="'+cat.id+'">'+cat.title+' <small>'+LIBRARY.filter(item=>collectionGroup(item)===cat.id).length+'</small></button>').join('')+'</nav>';
      let shown=0;
      const search=normalText(portalSearch.trim());
      for(const cat of PORTAL_CATEGORIES){
        const items=LIBRARY.filter(item=>collectionGroup(item)===cat.id&&(!search||normalText([item.title,item.category,item.year,item.description,item.subtitle].join(' ')).includes(search)));
        if(!items.length)continue;
        shown+=items.length;
        html+='<details class="collection-group" id="group-'+cat.id+'" data-group="'+cat.id+'"'+(search||cat.id==='portugal'?' open':'')+'><summary><span class="collection-group-mark" aria-hidden="true">'+cat.mark+'</span><span class="collection-group-title"><strong>'+esc(cat.title)+'</strong><small>'+esc(cat.description)+' · '+items.length+' '+(items.length===1?'coleção':'coleções')+'</small></span><span class="collection-chevron" aria-hidden="true">⌄</span></summary><div class="collection-group-body">';
        const years=new Map();
        for(const item of items){const year=collectionYear(item);if(!years.has(year))years.set(year,[]);years.get(year).push(item)}
        for(const year of [...years.keys()].sort((a,b)=>b-a)){
          const groupItems=years.get(year).sort((a,b)=>ptCollator.compare(a.title,b.title));
          html+='<section class="collection-year" data-year="'+year+'" aria-label="Coleções de '+(year||'ano desconhecido')+'"><div class="collection-year-head"><h4>'+(year||'Sem data')+'</h4><span>'+groupItems.length+' '+(groupItems.length===1?'coleção':'coleções')+'</span></div><div class="library-grid">'+groupItems.map(collectionTile).join('')+'</div></section>';
        }
        html+='</div></details>';
      }
      if(!shown)html+='<div class="collection-empty">Nenhuma coleção encontrada. Altera a pesquisa para consultar as outras edições.</div>';
      html+='</section>'+roadmapPanel()+'<p class="portal-note">O progresso fica apenas neste navegador. Para mudar de equipamento, utiliza Exportar / Importar em cada caderneta. Imagens de referência provenientes de fontes públicas, sujeitas aos direitos dos respetivos titulares.</p>';
      return html;
    }
    async function selectCollection(id,replaceRoute=true){
      const token=++selectionEpoch;
      const item=LIBRARY.find(x=>x.id===id&&x.status==='active');
      if(!item){
        if(replaceRoute)navigate('portal');
        return false;
      }
      cancelPendingCardTap();
      closeModal();
      if(activeCollectionId===id&&catalog.cards.length){
        if(replaceRoute)navigate('index');
        return true;
      }
      app.innerHTML='<div class="empty">A abrir '+esc(item.title)+'…</div>';
      try{
        const response=await fetch('/api/storage?kind=catalog&id='+encodeURIComponent(id),{cache:'no-cache'});
        if(token!==selectionEpoch)return false;
        if(!response.ok)throw new Error('Erro ao carregar: '+response.status);
        const data=await response.json();
        if(token!==selectionEpoch)return false;
        if(!Array.isArray(data.cards)||data.cards.length!==item.count)throw Error('Catálogo incompleto');
        const all=new Set();
        // Nomes distintos podem criar slugs iguais (pontuação e hífens).
        // Resolver a colisão sem alterar IDs nem progresso dos cromos.
        const sectionNames=new Map();
        const usedSectionSlugs=new Set();
        data.cards.forEach(c=>{
          if(all.has(c.id)||!c.id||!c.name||!c.section||!c.number)throw Error('Cromo inválido ou repetido');
          all.add(c.id);
          if(!sectionNames.has(c.section)){
            const base=sectionSlug(c.section)||'secao';
            let slug=base,num=2;
            while(usedSectionSlugs.has(slug))slug=base+'-'+num++;
            usedSectionSlugs.add(slug);
            sectionNames.set(c.section,slug);
          }
          c.sectionSlug=sectionNames.get(c.section);
        });
        if(token!==selectionEpoch)return false;
        activeCollectionId=id;
        catalog=data;
        state=readProgress(id,data.cards);
        currentPage=0;
        query='';
        computePages();
        view='index';
        if(replaceRoute)history.replaceState(null,'',routeHash());
        render();
        window.scrollTo({top:0,behavior:scrollBehavior()});
        return true;
      }catch(e){
        if(token!==selectionEpoch)return false;
        activeCollectionId=null;
        catalog={cards:[],sections:[]};
        state=emptyProgress();
        view='portal';
        if(replaceRoute)history.replaceState(null,'',routeHash());
        render();
        notify('Não foi possível abrir a coleção: '+e.message);
        return false;
      }
    }
    function sectionSlug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
    function hero(){const s=stats(),item=LIBRARY.find(x=>x.id===activeCollectionId);return '<div class="subtrail"><button data-action="portal">Todas as coleções</button> / '+esc(item.title)+'</div><section class="hero"><div><span class="section-label">'+esc(catalog.subtitle||item.title)+' · '+esc(catalog.year)+'</span><h1>'+esc(item.title)+'.<br><em>A tua caderneta.</em></h1><p>Explora todas as secções, revela os cromos e guarda o teu progresso neste dispositivo. Um toque amplia, dois toques rápidos voltam a tapar.</p><div class="hero-actions"><button class="pill gold" data-action="album">Abrir caderneta ↗</button><button class="pill" data-action="random">Descobrir um cromo ✦</button><button class="pill" data-action="hide-all">↺ Tapar todos os cromos</button></div></div><div class="hero-art" aria-hidden="true"><div class="hero-ring"><span>'+esc(item.year)+'</span></div></div></section><section class="metric-row"><div class="metric"><strong>'+s.all+'</strong><span>Cromos no catálogo</span></div><div class="metric"><strong>'+s.revealed+'</strong><span>Revelados</span></div><div class="metric"><strong>'+percent(s.revealed,s.all)+'%</strong><span>Descobertos</span></div><div class="metric"><strong>'+s.favs+'</strong><span>Favoritos</span></div></section>'}
    function indexView(){let html=hero()+'<section class="section-heading"><div><span class="section-label">Explorar a coleção</span><h2>Índice de secções</h2><p>Seleciona uma secção para abrir as respetivas páginas.</p></div><div class="search-wrap">⌕ <input id="search" aria-label="Pesquisar cromos" placeholder="Jogador, clube ou número..." value="'+esc(query)+'"></div></section>';
      if(query.trim()){const lower=query.trim().toLocaleLowerCase("pt-PT");const found=catalog.cards.filter(c=>[c.name,c.number,c.section,c.team||''].some(v=>String(v||"").toLocaleLowerCase("pt-PT").includes(lower)));html+='<p class="small-muted">'+found.length+' resultados</p><div class="result-list">'+found.slice(0,120).map(c=>'<button class="result" data-action="jump" data-id="'+esc(c.id)+'"><span><strong>'+esc(c.number||"—")+' · '+esc(c.name||"Cromo")+'</strong><small>'+esc(sectionLabel(c))+'</small></span><span>'+(isRevealed(c)?'✓':'↗')+'</span></button>').join("")+'</div>'+(found.length>120?'<p class="small-muted">A mostrar os primeiros 120 resultados.</p>':'');if(!found.length)html+='<div class="empty">Nenhum cromo encontrado. Experimenta outro termo.</div>';

        view='album';
      }else view='index';
      render();
    }
    async function start(){
      try{
        const response=await fetch('/api/storage?kind=library',{cache:'no-cache'});
        if(!response.ok)throw new Error('Índice de coleções indisponível');
        const items=await response.json();
        if(!Array.isArray(items) || items.length<2)throw new Error('Índice inválido');
        LIBRARY=items;
        try{
          const planResponse=await fetch('/api/storage?kind=plan',{cache:'no-cache'});
          if(planResponse.ok){
            const plan=await planResponse.json();
            if(plan.version===1 && plan.batchSize===2 && Array.isArray(plan.collections) && plan.collections.length>=20 && plan.collections.length===plan.goal && plan.collections.length%2===0)
              EXPANSION_PLAN=plan.collections;
          }
        }catch(e){/* O arquivo principal funciona mesmo sem o plano. */}
        if(location.hash.startsWith('#/c/'))await restoreHash();
        else{view='portal';render()}
      }catch(error){
        app.innerHTML='<div class="empty"><h2>Não foi possível abrir a biblioteca</h2><p>'+esc(error.message)+'</p><button class="tool" onclick="location.reload()">Tentar novamente</button></div>';
      }
    }
    start();
  })();
  </script>
</body>
</html>
