name: FUT - Integrar Serie A 2026-27 e Ligue 1 2025-26

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-italia-franca.yml"
      - "scripts/ingest_italia_franca.py"
  workflow_dispatch:

permissions:
  contents: write

# Não definir concurrency partilhado: os pending anteriores seriam substituídos.
# Exclusão entre as quatro workflows: lock Git ref exclusivo no passo de importação.
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adquirir lock, refazer sobre main e validar lote exato antes do commit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/catalog-write-lock.sh -- \
            bash scripts/catalog-publish-batch.sh leagues
