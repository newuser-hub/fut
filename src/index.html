    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    /* Página principal do portal — mantém a linguagem visual da caderneta. */

    .portal-hero h1{font-size:clamp(43px,7vw,86px);line-height:.99;letter-spacing:-.065em;margin:20px 0 23px;max-width:900px}.portal-hero h1 em{font-style:normal;color:var(--gold)}

    .library-summary{display:flex;gap:25px;flex-wrap:wrap;margin-top:32px}.library-summary span{font-size:12px;color:#bdcbd7}.library-summary strong{display:block;font-size:25px;color:white;letter-spacing:-.05em}

    .next-batch{border:1px solid rgba(223,181,107,.4);border-radius:17px;background:linear-gradient(120deg,#132e4a,#0b213a);padding:24px;margin:28px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}

<body>
  <header class="app-top">
    <div class="top-inner">
      <button class="brand" data-action="portal" aria-label="Voltar às coleções"><span class="brand-mark">F</span><span><strong>FUT · CROMOS</strong><small>Arquivo de cadernetas digitais</small></span></button>
      <nav class="top-actions" aria-label="Navegação principal"><button class="pill" data-action="portal" id="nav-portal">⌂ Coleções</button><button class="pill" data-action="index" id="nav-index">▦ Índice</button><button class="pill" data-action="album" id="nav-album">▣ Caderneta</button><button class="pill" data-action="favorites" id="nav-favorites">☆ Favoritos</button><button class="pill" data-action="random" id="nav-random" title="Revelar um cromo aleatório">✦ Surpresa</button></nav>
    </div><div class="progress-strip" aria-hidden="true"><div id="top-progress" style="width:0%"></div></div>
  </header>
  <main class="content" id="app"><div class="empty">A carregar o catálogo…</div></main>
  <footer class="footer"><div>FUT — arquivo independente para consulta pessoal · Não afiliado à Panini, FIFA, UEFA ou Cromos.pt</div><div>Imagens e marcas pertencem aos respetivos titulares. Dados e imagens referenciados a partir de <a href="https://www.cromos.pt/" target="_blank" rel="noopener noreferrer">Cromos.pt</a>. A disponibilidade pública não equivale a uma licença de reprodução.</div></footer>
  <input type="file" id="import-file" accept="application/json,.json" class="hidden" aria-label="Importar progresso">
  <div class="toast" id="toast" role="status" aria-live="polite"></div><div id="modal-root"></div>
  <script>
  (() => {
    "use strict";
    let LIBRARY = [];
    let activeCollectionId = null;
    const stateKey = id => "fut.album."+id+".progress.v1";
    const app = document.getElementById("app");
    const toastNode = document.getElementById("toast");
    let catalog = {cards:[], sections:[]}; let sections = []; let pages = []; let currentPage = 0; let view = "portal"; let query = ""; let modalCard = null;
    let state = {revealed:{}, favorites:{}};
    // Estado independente por coleção: é carregado ao selecionar a caderneta.
    const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    const percent = (n,d) => d?Math.round(n*100/d):0;
    const keyCard = c => c.id;
    const isRevealed = c => !!state.revealed[keyCard(c)];
    const isFavorite = c => !!state.favorites[keyCard(c)];
    const save = () => {try{localStorage.setItem(stateKey(activeCollectionId),JSON.stringify(state))}catch(e){notify("Sem espaço para guardar o progresso neste dispositivo.")}};
    function notify(message){toastNode.textContent=message;toastNode.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastNode.classList.remove("show"),2600)}
    function pageFor(cardId){return pages.findIndex(p=>p.cards.some(c=>c.id===cardId))}
    function sectionStats(section){let n=section.cards.filter(isRevealed).length;return {n,total:section.cards.length,pct:percent(n,section.cards.length)}}
    function stats(){return {all:catalog.cards.length, revealed:catalog.cards.filter(isRevealed).length,favs:catalog.cards.filter(isFavorite).length}}
    function computePages(){sections=[];pages=[];const map=new Map();catalog.cards.forEach(c=>{const slug=c.sectionSlug||"outros";if(!map.has(slug)){const s={slug,name:c.section||slug,cards:[]};map.set(slug,s);sections.push(s)}map.get(slug).cards.push(c)});sections.forEach(s=>{for(let offset=0;offset<s.cards.length;offset+=9)pages.push({section:s,cards:s.cards.slice(offset,offset+9),pageInSection:1+Math.floor(offset/9),sectionPages:Math.ceil(s.cards.length/9)})})}
    const sectionLabel = c => c.section||"Coleção";
    const buttons = [{action:"portal"},{action:"index"},{action:"album"},{action:"favorites"}];
    function updateTop(){const s=stats();document.getElementById("top-progress").style.width=percent(s.revealed,s.all)+"%";buttons.forEach(b=>document.getElementById("nav-"+b.action).classList.toggle("is-active",view===b.action));["index","album","favorites","random"].forEach(a=>document.getElementById("nav-"+a).disabled=!activeCollectionId)}
    function portalStats(item){
      try{
        const raw=JSON.parse(localStorage.getItem(stateKey(item.id))||'{}');
        const count=Object.keys(raw.revealed||{}).length;
        return {revealed:Math.min(count,item.count||0),pct:percent(count,item.count||0)};
      }catch(e){return {revealed:0,pct:0}}
    }
    function portalView(){
      const ready=LIBRARY.filter(c=>c.status==='active');

    async function selectCollection(id,replaceRoute=true){
      const item=LIBRARY.find(x=>x.id===id&&x.status==='active');
      if(!item)return;
      cancelPendingCardTap();
      closeModal();
      if(activeCollectionId===id&&catalog.cards.length){
        navigate('index');
        return;
      }
      app.innerHTML='<div class="empty">A abrir '+esc(item.title)+'…</div>';
      try{
        const response=await fetch('/data/'+encodeURIComponent(id)+'.json',{cache:'no-cache'});
        if(!response.ok)throw new Error('Erro ao carregar: '+response.status);
        const data=await response.json();
        if(!Array.isArray(data.cards)||data.cards.length!==item.count)throw Error('Catálogo incompleto');
        const all=new Set();
        // Nomes distintos podem criar slugs iguais (pontuação e hífens).
        // Resolver a colisão sem alterar IDs nem progresso dos cromos.
        const sectionNames=new Map();
        const usedSectionSlugs=new Set();
        data.cards.forEach(c=>{
          if(all.has(c.id)||!c.id||!c.name||!c.section||!c.number)throw Error('Cromo inválido ou repetido');
          all.add(c.id);
          if(!sectionNames.has(c.section)){
            const base=sectionSlug(c.section)||'secao';
            let slug=base,num=2;
            while(usedSectionSlugs.has(slug))slug=base+'-'+num++;
            usedSectionSlugs.add(slug);
            sectionNames.set(c.section,slug);
          }
          c.sectionSlug=sectionNames.get(c.section);
        });
        activeCollectionId=id;
        catalog=data;
        try{
          const saved=JSON.parse(localStorage.getItem(stateKey(id))||'{}');
          state={revealed:saved.revealed||{},favorites:saved.favorites||{}};
        }catch(e){state={revealed:{},favorites:{}}}
        currentPage=0;
        query='';
        computePages();
        view='index';
        if(replaceRoute)history.replaceState(null,'',routeHash());
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      }catch(e){
        activeCollectionId=null;
        catalog={cards:[],sections:[]};
        view='portal';
        render();
        notify('Não foi possível abrir a coleção: '+e.message);
      }
    }
    function sectionSlug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}

    function cardMarkup(c){const turned=isRevealed(c);const label=turned?"Um toque para ampliar, dois toques para tapar cromo":"Virar cromo";const image=c.available!==false&&c.image?'<img '+(turned?'src="'+esc(c.image)+'"':'data-src="'+esc(c.image)+'"')+' data-source="'+esc(c.source||'')+'" alt="'+esc(c.number+' '+c.name)+'" loading="lazy" onerror="if(this.dataset.source && this.src !== this.dataset.source){this.src=this.dataset.source;this.dataset.source=\'\'}else{this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'}">':'';

    function pageView(){if(!pages.length)return '<div class="empty">O arquivo de cromos ainda está a ser preparado.</div>';currentPage=Math.max(0,Math.min(currentPage,pages.length-1));const p=pages[currentPage],cnt=p.cards.filter(isRevealed).length;

    function favoritesView(){const fav=catalog.cards.filter(isFavorite);return '<div class="section-heading"><div><span class="section-label">A tua seleção</span><h2>Favoritos</h2><p>Marca com ☆ os cromos que queres encontrar rapidamente.</p></div><button class="tool" data-action="index">⌂ Índice</button></div>'+(fav.length?'<div class="result-list">'+fav.map(c=>'<button class="result" data-action="jump" data-id="'+esc(c.id)+'"><span><strong>'+esc(c.number||"—")+' · '+esc(c.name||"Cromo")+'</strong><small>'+esc(sectionLabel(c))+'</small></span><span>↗</span></button>').join('')+'</div>':'<div class="empty">Ainda não adicionaste nenhum cromo aos favoritos.</div>')}
    function routeHash(){if(view==='portal'||!activeCollectionId)return '#/colecoes';const base='#/c/'+encodeURIComponent(activeCollectionId);if(view==='index')return base+'/indice';if(view==='favorites')return base+'/favoritos';const p=pages[currentPage];return p?base+'/secao/'+encodeURIComponent(p.section.slug)+'/'+p.pageInSection:base+'/indice'}

    function zoom(c){if(!c)return;modalCard=c.id;const root=document.getElementById('modal-root');root.innerHTML='<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Detalhes do cromo"><div class="modal-header"><div><h3>'+esc(c.number+' · '+c.name)+'</h3><p style="margin:0">'+esc(c.section)+'</p></div><button data-action="close-modal" aria-label="Fechar">✕</button></div>'+(c.available!==false&&c.image?'<img src="'+esc(c.image)+'" alt="'+esc(c.name)+'" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=\'\'}" data-fallback="'+esc(c.source||'')+'">':'<div class="empty">Sem imagem disponível</div>')+'<div class="modal-controls"><button data-action="favorite" data-id="'+esc(c.id)+'">'+(isFavorite(c)?'★ Favorito':'☆ Favorito')+'</button><button data-action="close-modal">Fechar</button></div></div></div>';document.body.style.overflow='hidden'}

    function exportProgress(){const payload={app:'fut',collection:activeCollectionId,version:1,exportedAt:new Date().toISOString(),revealed:Object.keys(state.revealed),favorites:Object.keys(state.favorites)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='fut-'+activeCollectionId+'-progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),500);notify('Progresso exportado.')}
    async function importProgress(file){if(!file||!activeCollectionId)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='fut'||obj.collection!==activeCollectionId||!Array.isArray(obj.revealed)||!Array.isArray(obj.favorites))throw Error('O ficheiro pertence a outra coleção ou está inválido');if(!confirm('Substituir o progresso atual desta coleção pelo ficheiro importado?'))return;const valid=new Set(catalog.cards.map(c=>c.id));state.revealed={};state.favorites={};obj.revealed.filter(id=>valid.has(id)).forEach(id=>state.revealed[id]=true);obj.favorites.filter(id=>valid.has(id)).forEach(id=>state.favorites[id]=true);save();render();notify('Progresso importado com sucesso.')}catch(e){notify('Ficheiro não reconhecido: '+e.message)}}
    // Esperamos brevemente para distinguir toque único de duplo nos cromos já revelados.
    // A mesma lógica funciona com rato e com toques no Safari/iPhone.
    let pendingCardTap = null;
    const DOUBLE_TAP_MS = 340;
    function cancelPendingCardTap(){
      if(pendingCardTap){
        clearTimeout(pendingCardTap.timer);
        pendingCardTap = null;
      }
    }
    function handleCardClick(card, btn, event){
      if(!isRevealed(card)){
        cancelPendingCardTap();
        state.revealed[card.id]=true;
        save();
        btn.classList.add('is-flipped');
        btn.setAttribute('aria-pressed','true');
        btn.setAttribute('aria-label','Um toque para ampliar, dois toques para tapar cromo '+(card.number||''));
        const img=btn.querySelector('img[data-src]');
        if(img){img.src=img.dataset.src;delete img.dataset.src}
        setTimeout(()=>{if(view==='album'&&!modalCard)render()},520);
        return;
      }
      // Enter/Espaço: ampliar imediatamente; não existe gesto de duplo toque no teclado.
      if(event.detail===0){
        cancelPendingCardTap();
        zoom(card);
        return;
      }
      if(pendingCardTap && pendingCardTap.id===card.id){
        cancelPendingCardTap();
        delete state.revealed[card.id];
        save();
        btn.classList.remove('is-flipped');
        btn.setAttribute('aria-pressed','false');
        btn.setAttribute('aria-label','Virar cromo '+(card.number||''));
        setTimeout(()=>{if(view==='album'&&!modalCard)render()},520);
        notify('Cromo novamente tapado.');
        return;
      }
      cancelPendingCardTap();
      const id=card.id;
      const timer=setTimeout(()=>{
        if(pendingCardTap?.id===id){
          pendingCardTap=null;
          if(isRevealed(card) && !modalCard) zoom(card);
        }
      },DOUBLE_TAP_MS);
      pendingCardTap={id,timer};
    }
    // Passar páginas por gesto horizontal no ecrã tátil (Safari/iPhone e Android).
    // Não capturamos os movimentos verticais, para preservar o scroll natural.
    let swipeOrigin=null;
    let swipeClickBlockUntil=0;
    app.addEventListener('touchstart',event=>{
      swipeOrigin=null;
      if(view!=='album'||modalCard||event.touches.length!==1||!event.target.closest('.paper-shell'))return;
      const touch=event.touches[0];
      swipeOrigin={x:touch.clientX,y:touch.clientY,id:touch.identifier,page:currentPage,started:Date.now()};
    },{passive:true});
    app.addEventListener('touchend',event=>{
      if(!swipeOrigin)return;
      const origin=swipeOrigin;
      swipeOrigin=null;
      if(view!=='album'||modalCard||origin.page!==currentPage||event.touches.length!==0)return;
      const touch=Array.from(event.changedTouches).find(t=>t.identifier===origin.id);
      if(!touch)return;
      const dx=touch.clientX-origin.x;
      const dy=touch.clientY-origin.y;
      if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4||Date.now()-origin.started>1400)return;

      event.preventDefault();

      cancelPendingCardTap();
      const target=currentPage+(dx<0?1:-1);
      if(target>=0&&target<pages.length)navigate('album',target);
    },{passive:false});

    app.addEventListener('click',event=>{
      if(Date.now()<swipeClickBlockUntil && event.target.closest('.paper-shell')){
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    },true);
    app.addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;const card=cardById(btn.dataset.id);if(action==='next-batch'){
      const waiting=LIBRARY.filter(x=>x.status!=='active').slice(0,2);

      const prompt='Autorizo o próximo lote de duas coleções no repositório newuser-hub/fut, já ligado ao Vercel: integra '+scope+'. Verifica integralmente os catálogos, números, imagens, secções, favoritos, progresso independente e gestos; publica e testa em produção. Mantém todas as coleções anteriores. No final, apresenta novamente o botão de autorização para as próximas duas, repetindo o ciclo.';
      if(navigator.clipboard?.writeText)navigator.clipboard.writeText(prompt).then(()=>notify('Pedido copiado. Cola-o na conversa do ChatGPT.')).catch(()=>window.prompt('Copia o pedido para o ChatGPT:',prompt));

    }else if(action==='portal')navigate('portal');else if(action==='collection')selectCollection(btn.dataset.collection);else if(action==='scroll-collections'){app.querySelector('#collection-grid')?.scrollIntoView({behavior:'smooth'})}else if(!activeCollectionId)return;else if(action==='index')navigate('index');else if(action==='album')navigate('album');else if(action==='favorites')navigate('favorites');else if(action==='section'){const idx=pages.findIndex(p=>p.section.slug===btn.dataset.slug);navigate('album',idx>=0?idx:0)}else if(action==='jump'&&card){navigate('album',pageFor(card.id));const el=app.querySelector('[data-card="'+CSS.escape(card.id)+'"]');if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('spotlight')}}else if(action==='prev')navigate('album',currentPage-1);else if(action==='next')navigate('album',currentPage+1);else if(action==='flip'&&card){handleCardClick(card,btn,event)}else if(action==='favorite'&&card){if(isFavorite(card))delete state.favorites[card.id];else state.favorites[card.id]=true;save();if(modalCard)zoom(card);else render()}else if(action==='reveal-page'){reveal(pages[currentPage].cards.map(c=>c.id),true);notify('Todos os cromos desta página revelados.')}else if(action==='hide-page'){reveal(pages[currentPage].cards.map(c=>c.id),false);notify('Cromos desta página novamente tapados.')}else if(action==='reveal-all'){reveal(catalog.cards.map(c=>c.id),true);notify('Toda a coleção foi revelada.')}else if(action==='hide-all'){if(confirm('Voltar a tapar todos os cromos? Os favoritos serão preservados.')){state.revealed={};save();render();notify('Todos os cromos ficaram tapados.')}}else if(action==='random'){const pool=catalog.cards.filter(c=>!isRevealed(c));const candidates=pool.length?pool:catalog.cards;if(!candidates.length)return;const chosen=candidates[Math.floor(Math.random()*candidates.length)];state.revealed[chosen.id]=true;save();navigate('album',pageFor(chosen.id));notify('Descoberto: '+chosen.number+' · '+chosen.name)}else if(action==='export')exportProgress();else if(action==='import')document.getElementById('import-file').click()});
    document.getElementById('modal-root').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close-modal' && b.classList.contains('modal-backdrop') && e.target!==b)return;if(b.dataset.action==='close-modal')closeModal();else if(b.dataset.action==='favorite'){const c=cardById(b.dataset.id);if(c){if(isFavorite(c))delete state.favorites[c.id];else state.favorites[c.id]=true;save();zoom(c)}}});
    app.addEventListener('change',e=>{if(e.target.id==='jump-select'){const idx=pages.findIndex(p=>p.section.slug===e.target.value);if(idx>=0)navigate('album',idx)}});
    app.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}});
    document.querySelector('header.app-top').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='portal')navigate('portal');if(!activeCollectionId)return;if(a==='index')navigate('index');if(a==='album')navigate('album');if(a==='favorites')navigate('favorites');if(a==='random'){const pool=catalog.cards.filter(c=>!isRevealed(c));const a=pool.length?pool:catalog.cards;if(a.length){const c=a[Math.floor(Math.random()*a.length)];state.revealed[c.id]=true;save();navigate('album',pageFor(c.id));notify('Descoberto: '+c.number+' · '+c.name)}}});
    document.getElementById('import-file').addEventListener('change',e=>{importProgress(e.target.files[0]);e.target.value=''});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(view==='album'&&!modalCard&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){if(e.key==='ArrowRight'){e.preventDefault();navigate('album',Math.min(pages.length-1,currentPage+1))}else if(e.key==='ArrowLeft'){e.preventDefault();navigate('album',Math.max(0,currentPage-1))}}});
    window.addEventListener('hashchange',restoreHash);
    async function restoreHash(){
      const parts=decodeURIComponent(location.hash||'').split('/');
      if(parts[1]!=='c'||!parts[2]){view='portal';render();return}
      const id=parts[2];
      if(id!==activeCollectionId){await selectCollection(id,false)}
      if(!activeCollectionId)return;
      const kind=parts[3];
      if(kind==='favoritos'){view='favorites'}
      else if(kind==='secao'){
        const idx=pages.findIndex(p=>p.section.slug===parts[4]&&p.pageInSection===Number(parts[5]||'1'));
        currentPage=idx>=0?idx:0;
        view='album';
      }else{view='index'}
      render();
    }
    async function start(){
      try{
        const response=await fetch('/library.json',{cache:'no-cache'});
        if(!response.ok)throw new Error('Índice de coleções indisponível');
        const items=await response.json();
        if(!Array.isArray(items) || items.length<2)throw new Error('Índice inválido');
        LIBRARY=items;
        if(location.hash.startsWith('#/c/'))await restoreHash();
        else{view='portal';render()}
      }catch(error){
        app.innerHTML='<div class="empty"><h2>Não foi possível abrir a biblioteca</h2><p>'+esc(error.message)+'</p><button class="tool" onclick="location.reload()">Tentar novamente</button></div>';
      }
    }
    start();
  })();
  </script>
</body>
</html>
