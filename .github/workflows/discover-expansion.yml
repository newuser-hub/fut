name: FUT - Descobrir catalogos candidatos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-expansion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Identificar IDs, slugs e contagens diretamente na origem
        shell: bash
        run: |
          python3 - <<'PY'
          import json,html
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.data=None
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if 'data-page' in d:self.data=json.loads(html.unescape(d['data-page']))
          url='https://www.cromos.pt/collections'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
          content=urlopen(req,timeout=20).read(6_000_000).decode('utf-8','replace')
          p=P();p.feed(content)
          if p.data:
            print('COMPONENT',p.data.get('component'))
            print('PROP KEYS',list(p.data.get('props',{}).keys()))
            for key,val in p.data.get('props',{}).items():
              print('PROP',key,'type',type(val).__name__,'preview',str(val)[:330])
          else:print('NO INERTIA',content[:700])
          PY
