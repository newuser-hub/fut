name: FUT - Diagnostico Serie A e Ligue 1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-italia-franca.yml"
      - "scripts/ingest_italia_franca.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fut-audit-italia-franca
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar contagens e amostras de imagens das duas coleções
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from collections import Counter
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          import re,hashlib
          urls={
           'italia':'https://stickersone.com/it/albumgrid-calciatori-2026-2027-panini-4689',
           'franca':'https://stickersone.com/en/albumgrid-ligue-1-2026-2027-adrenalyn-xl-panini-4650',
          }
          for key,url in urls.items():
            html=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read(3_000_000)
            soup=BeautifulSoup(html,'html.parser')
            tiles=soup.select('.card.figurina.card-body')
            rows=[]
            for tile in tiles:
              strong=tile.select_one('.area-text strong')
              label=strong.get_text(' ',strip=True) if strong else ''
              m=re.search(r'(?:Figurina|Card)\s+n[°.]*\s*(.+)',label)
              number=m.group(1).strip() if m else ''
              name=tile.select_one('.area-text.mt-2 strong')
              name=name.get_text(' ',strip=True) if name else ''
              img=tile.select_one('.area-img picture img')
              img=img.get('src','') if img else ''
              badge=tile.select_one('.area-img img.scudetto')
              team=badge.get('title','').strip() if badge else None
              rows.append((number,name,img,team))
            numbers=[x[0] for x in rows]
            missing=[x for x in rows if not x[2] or '/vuote/' in x[2]]
            genuine=[x for x in rows if x[2] and '/vuote/' not in x[2]]
            print(key,'TOTAL',len(rows),'UNIQUE',len(set(numbers)),'MISSING',len(missing),'IMAGE_LINKS',len(genuine),flush=True)
            print('FIRST',rows[:7],'LAST',rows[-7:],flush=True)
            print('IMAGE_SOURCE_EXAMPLES',genuine[:4],flush=True)
            print('SECTIONS',Counter(x[3] for x in rows).most_common(10),flush=True)
            for n,name,path,team in genuine[:3]:
              u=urljoin(url,path)
              try:
                with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://stickersone.com/'}),timeout=18) as response:
                  body=response.read(3_000_001)
                  print('GET',n,name,response.status,response.headers.get('Content-Type'),len(body),hashlib.sha256(body).hexdigest()[:12],flush=True)
              except Exception as exc:print('GET_ERROR',n,type(exc).__name__,str(exc)[:180],flush=True)
          PY
