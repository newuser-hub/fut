name: FUT - Integrar Serie A 2026-27 e Ligue 1 2025-26

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-italia-franca.yml"
      - "scripts/ingest_italia_franca.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fut-ingest-leagues
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar parser
        run: python3 -m pip install --quiet beautifulsoup4
      - name: Auditar todos os cromos e as imagens de ambas as ligas
        run: python3 -u scripts/ingest_italia_franca.py
      - name: Validar integridade das coleções e JavaScript
        run: |
          node scripts/unpack-data.mjs
          python3 scripts/verify_catalogs.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("public/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,re.S)
          assert len(scripts)==1
          Path("/tmp/fut-leagues.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/fut-leagues.js
      - name: Publicar catalogos auditados na branch principal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/library.json public/data/serie-a-calciatori-2026-27.json public/data/ligue-1-foot-2025-26.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Integrar cadernetas Panini Itália e França com imagens auditadas [skip actions]"
          # Reintegrar somente ficheiros novos sobre a branch atual caso
          # outros lotes tenham avançado durante a auditoria.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
