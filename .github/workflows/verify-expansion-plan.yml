name: FUT - Validar plano de 20 coleções e botões

on:
  push:
    branches: [main]
    paths:
      - "public/expansion-plan.json"
      - "public/library.json"
      - "public/data/fifa-365-2026.json"
      - "public/data/liga-portugal-2023-24.json"
      - "public/data/ucl-topps-2024-25.json"
      - "public/data/liga-portugal-2022-23.json"
      - "public/data/world-cup-2002.json"
      - "public/data/world-cup-1998.json"
      - "public/data/euro-2000.json"
      - "public/data/confederations-2017.json"
      - "scripts/verify_audited_batch.py"
      - "src/index.html"
      - "scripts/verify-portal-groups.mjs"
      - "scripts/verify_expansion_plan.py"
      - ".github/workflows/verify-expansion-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar roteiro, catalogos e fonte HTML
        run: |
          python3 scripts/verify_expansion_plan.py
          python3 scripts/verify_audited_batch.py requests/roadmap-batch.json
          node scripts/unpack-data.mjs
          python3 scripts/verify_catalogs.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("public/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,re.S)
          assert len(scripts)==1
          Path("/tmp/fut-roadmap.js").write_text(scripts[0],encoding="utf-8")
          assert html.count('data-action="next-batch"')>=1
          assert "roadmap-grid" in html and "roadmap-copy" in html
          PY
          node --check /tmp/fut-roadmap.js
          node scripts/verify-portal-groups.mjs
