name: FUT - Verificar READY do SHA e protecao em producao

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA exato do deployment a verificar (vazio = SHA do evento)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FUT_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar metadados do deployment e protecao sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          # Primeiro: Vercel API tem de confirmar READY, production, SHA exato,
          # e ambos os aliases no mesmo deployment. Sem isso, PENDENTE/FAIL.
          # Só depois: GET anónimo ao site e verificar o WWW-Authenticate
          # da aplicação, não confundir com login/proteção da plataforma.
          node scripts/verify-fut-deployment.mjs
