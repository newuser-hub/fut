name: FUT - Integrar próximo lote de duas coleções

on:
  push:
    branches: [main]
    paths:
      - "requests/next-batch.json"
      - "scripts/ingest_batch.py"
      - ".github/workflows/ingest-next-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fut-ingest-collections
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruir caderneta existente
        run: node scripts/unpack-data.mjs
      - name: Auditar e integrar as duas novas coleções
        run: python3 -u scripts/ingest_batch.py
      - name: Construir e validar
        run: |
          node scripts/unpack-data.mjs
          python3 scripts/verify_catalogs.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/fut.js').write_text(scripts[0])
          PY
          node --check /tmp/fut.js
      - name: Guardar resultados verificados em main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html public/index.html public/library.json public/data
          if git diff --cached --quiet; then
            echo "Nada a atualizar — a coleção já está no portal."
          else
            git commit -m "Integrar lote de duas coleções FUT [skip actions]"
            git push origin HEAD:main
          fi

