name: FUT - Verificar protecao publica em producao

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-fut-access.yml"
      - "public/expansion-plan.json"
      - "public/library.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar acesso anonimo aos dados e ao portal protegido
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FUT_ALBUM_PASSWORD' proxy.js
          grep -q 'status:401' proxy.js
          grep -q 'WWW-Authenticate' proxy.js
          for host in fut-rosy.vercel.app fut-pjr-s-projects.vercel.app; do
            for path in / /library.json /data/idolos-pt-2026-27.json /data/ucl-topps-2025-26.json /data/match-attax-extra-2025-26.json /data/fifa-365-2026.json /data/liga-portugal-2023-24.json /data/ucl-topps-2024-25.json /data/liga-portugal-2022-23.json /data/world-cup-2002.json /data/world-cup-1998.json /data/euro-2000.json /data/confederations-2017.json /data/world-cup-1994.json /data/euro-1996.json /data/liga-portugal-2020-21.json /data/liga-portugal-2019-20.json /data/euro-2008.json /data/confederations-2013.json /data/liga-portugal-2018-19.json /data/liga-portugal-2017-18.json /expansion-plan.json; do
              status=$(curl -sS --max-time 20 -D /tmp/fut-headers -o /tmp/fut-body -w '%{http_code}' "https://$host$path")
              echo "$host$path -> HTTP $status"
              if [[ "$status" != "401" ]]; then
                echo "Falha: esperado HTTP 401 (sem credenciais), obtido $status"
                exit 1
              fi
            done
          done
          echo "PASS: portal, manifesto e cartoes protegidos sem credenciais"
